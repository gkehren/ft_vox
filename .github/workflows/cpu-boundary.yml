# Epic #204 CPU/GPU boundary gate (issues #210 / #211) + build hygiene
# (review §4.12).
#
# The CPU-only boundary checks run WITHOUT a GPU, so they are exercised
# automatically here on every push / PR — making the epic's enforcement durable
# even though the heavier CpuOnlyBuild clean-configure gate is opt-in for local
# everyday runs (FT_VOX_CPU_ONLY_BUILD_CHECK=ON enables it; this workflow sets it).
#
# Jobs:
#   cpu-linux        — FT_VOX_GRAPHICS=OFF configure/build/test on Ubuntu (GCC, Ninja).
#   cpu-windows      — FT_VOX_GRAPHICS=OFF configure/build/test on Windows (MSVC).
#   cpu-sanitizers   — ASan + UBSan over the CPU suite (review M21: the sanitizer
#                      job the test_terrain comment referenced but never existed).
#   tsan             — TSan over test_network + the headless runner (thread pool,
#                      network io thread). The CPU-bound TerrainGeneration
#                      fixture is excluded (expected TSan slowdown > timeout).
#   graphics-linux   — COMPILE gate for the full graphical configuration (game +
#                      Vulkan tests + visual harness). No GPU is available on the
#                      runner, so device tests are not executed here — but the
#                      renderer/Vulkan code is no longer CI-unbuilt.
# Both CPU jobs run the include/link guards (CoreIncludeGuard, HeadlessDeps), the
# headless acceptance driver (HeadlessRunner) and the nested clean-configure gate
# (CpuOnlyBuild). No Vulkan SDK / SDL3 / shader toolchain is required or discovered.

name: cpu-boundary

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (review §4.12).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ ninja-build python3 git libboost-system-dev

      # FetchContent sources (GLM / FastNoise2) keyed on the dependency recipe.
      - name: Cache FetchContent deps
        uses: actions/cache@v4
        with:
          path: build-cpu/_deps
          key: deps-linux-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Configure (CPU-only, graphics not discovered)
        run: >
          cmake -S . -B build-cpu -G Ninja
          -DFT_VOX_GRAPHICS=OFF
          -DFT_VOX_DEP_MODE=system
          -DFT_VOX_CPU_ONLY_BUILD_CHECK=ON
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-cpu -j

      - name: Test (CPU-only suite + clean-configure gate)
        run: ctest --test-dir build-cpu --output-on-failure --timeout 600

  cpu-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Cache FetchContent deps
        uses: actions/cache@v4
        with:
          path: build-cpu/_deps
          key: deps-windows-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Configure (CPU-only, no vcpkg toolchain)
        run: >
          cmake -S . -B build-cpu
          -DFT_VOX_GRAPHICS=OFF
          -DFT_VOX_DEP_MODE=system
          -DFT_VOX_CPU_ONLY_BUILD_CHECK=ON

      - name: Build
        run: cmake --build build-cpu --config Release --parallel

      - name: Test (CPU-only suite + clean-configure gate)
        run: ctest --test-dir build-cpu -C Release --output-on-failure --timeout 600

  cpu-sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ ninja-build python3 git libboost-system-dev

      - name: Cache FetchContent deps
        uses: actions/cache@v4
        with:
          path: build-asan/_deps
          key: deps-linux-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Configure (CPU-only, ASan + UBSan)
        run: >
          cmake -S . -B build-asan -G Ninja
          -DFT_VOX_GRAPHICS=OFF
          -DFT_VOX_DEP_MODE=system
          -DFT_VOX_SANITIZERS=ON
          -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build-asan -j

      # TerrainGeneration is excluded: a ~60 s CPU-bound determinism fixture
      # whose ASan+UBSan slowdown exceeds the per-test timeout (expected, not
      # a bug). It still runs natively in cpu-linux/cpu-windows, and the terrain
      # code is exercised under sanitizers by BiomeMapGeneration/HeadlessRunner.
      # 900 s gives HeadlessRunner headroom (it runs ~590 s under ASan).
      - name: Test (CPU suite under ASan + UBSan)
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-asan --output-on-failure --timeout 900 -E "CpuOnlyBuild|TerrainGeneration"

  tsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ ninja-build python3 git libboost-system-dev

      - name: Cache FetchContent deps
        uses: actions/cache@v4
        with:
          path: build-tsan/_deps
          key: deps-linux-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Configure (CPU-only, TSan)
        run: >
          cmake -S . -B build-tsan -G Ninja
          -DFT_VOX_GRAPHICS=OFF
          -DFT_VOX_DEP_MODE=system
          -DFT_VOX_TSAN=ON
          -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build-tsan -j

      # The threaded surfaces: the UDP prototype (io thread vs caller) and the
      # work-stealing pool behind the headless runner (which also exercises the
      # call_once biome-config initialization across worker threads).
      # TerrainGeneration is deliberately EXCLUDED: it is a ~60 s CPU-bound
      # single-thread fixture whose TSan slowdown exceeds any reasonable test
      # timeout (expected, not a race); its threading is covered via Headless.
      - name: Test (network + headless under TSan)
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: >
          ctest --test-dir build-tsan --output-on-failure --timeout 600
          -R "NetworkIntegrationTest|HeadlessSmoke|HeadlessRunner"

  graphics-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # glslc (shaderc) is required, not just glslang-tools: the shaders use
      # Google-style #include directives, which glslc resolves natively (-I)
      # but glslangValidator rejects without the include extension enabled.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ ninja-build python3 git \
            libvulkan-dev glslc glslang-tools libboost-system-dev

      - name: Cache FetchContent deps
        uses: actions/cache@v4
        with:
          path: build-g/_deps
          key: deps-graphics-linux-${{ hashFiles('cmake/Dependencies.cmake') }}

      # SDL3 is fetched from the pinned commit (no distro package on the LTS
      # runner). This is a COMPILE gate — the runner has no display server.
      # SDL3's CMake hard-errors when no X11/Wayland dev libraries are present;
      # the documented escape (README-cmake.md FAQ) is SDL_UNIX_CONSOLE_BUILD,
      # which builds SDL without windowing. The game/test code still compiles
      # and links against the SDL API.
      - name: Configure (full graphical build)
        run: >
          cmake -S . -B build-g -G Ninja
          -DFT_VOX_GRAPHICS=ON
          -DFT_VOX_DEP_MODE=system
          -DFT_VOX_FETCH_SDL3=ON
          -DSDL_UNIX_CONSOLE_BUILD=ON
          -DSDL_X11=OFF -DSDL_WAYLAND=OFF -DSDL_KMSDRM=OFF
          -DSDL_OPENGL=OFF -DSDL_OPENGLES=OFF
          -DCMAKE_BUILD_TYPE=Release

      - name: Build (game + Vulkan tests + visual harness)
        run: cmake --build build-g -j
