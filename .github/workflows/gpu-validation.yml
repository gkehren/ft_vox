# Optional GPU runtime validation (stabilization Phase 6; PR #244 review).
#
# TRUST MODEL (Option A — strict, simple):
#   * workflow_dispatch ONLY, honored ONLY on the protected `main` branch.
#   * NO pull_request trigger: unmerged / fork PR code NEVER executes on the
#     persistent self-hosted GPU runner. A label is an opt-in convenience,
#     not a security boundary, so label-based PR execution was removed.
#   * GPU validation of an unmerged PR is performed MANUALLY on the
#     developer's canonical machine before merge (docs/gpu-validation.md).
#     An unmerged PR has NOT undergone GPU CI validation merely because
#     `main` passed.
#   * Minimal permissions (contents: read); checkout credentials are not
#     persisted; no secrets are referenced or exposed to the build.
#   * No privileged package installation: the dedicated runner is
#     provisioned with the dependencies; the job verifies them and fails
#     loudly when absent (build code never gets privileged escalation).
#
# Without a suitable GPU runner the device tests are NOT EXECUTED — the
# note job reports that explicitly, never as "passed". Normal CPU CI
# (cpu-boundary.yml) remains the per-PR gate and is unaffected.

name: gpu-validation

on:
  workflow_dispatch:
    inputs:
      visual_mode:
        description: "Visual regression mode (smoke = relaxed cross-vendor tolerances; strict = canonical-GPU golden gate)"
        required: false
        default: "smoke"
        type: choice
        options: [smoke, strict]

permissions:
  contents: read

concurrency:
  group: gpu-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gpu-linux:
    # Strict ref trust: a manual dispatch is honored ONLY on refs/heads/main
    # (the protected branch). Selecting any other ref skips this job — the
    # note job below reports the tests as not executed. Fork/PR code can
    # never reach this persistent runner through this workflow.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, gpu]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Record GPU / driver environment
        run: |
          {
            echo "## GPU environment"
            echo '```'
            vulkaninfo --summary 2>/dev/null | head -60 || echo "vulkaninfo unavailable"
            lspci | grep -i vga || true
            uname -a
            g++ --version | head -1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify runner prerequisites (no privileged installation)
        run: |
          missing=0
          for tool in cmake g++ ninja python3 git vulkaninfo glslc; do
            command -v "$tool" >/dev/null 2>&1 || { echo "MISSING: $tool"; missing=1; }
          done
          if [ "$missing" -ne 0 ]; then
            echo "The dedicated GPU runner must be provisioned with these tools." >&2
            echo "This workflow intentionally performs no privileged package installation." >&2
            exit 1
          fi
          if [ -z "${VK_LAYER_PATH:-}" ] && [ ! -d /usr/share/vulkan/explicit_layer.d ]; then
            echo "MISSING: Vulkan validation layers (VK_LAYER_PATH or /usr/share/vulkan/explicit_layer.d)" >&2
            exit 1
          fi

      - name: Configure (full graphical build)
        run: >
          cmake -S . -B build-g -G Ninja
          -DFT_VOX_GRAPHICS=ON
          -DFT_VOX_DEP_MODE=system
          -DFT_VOX_FETCH_SDL3=ON
          -DSDL_UNIX_CONSOLE_BUILD=ON
          -DSDL_X11=OFF -DSDL_WAYLAND=OFF -DSDL_KMSDRM=OFF
          -DSDL_OPENGL=OFF -DSDL_OPENGLES=OFF
          -DCMAKE_BUILD_TYPE=Release

      - name: Build (game + device tests + visual harness)
        run: cmake --build build-g -j

      - name: Vulkan device tests (validation enabled)
        env:
          FT_VOX_VALIDATION: "1"
        run: >
          ctest --test-dir build-g --output-on-failure --timeout 600
          -R "VulkanResourceSmoke|VulkanValidationErrorReporting|MeshUploadLifecycle|MeshArena|MobVulkanRender|PostResizeFormats|WorldPersistence"

      - name: Visual regression + gameplay item checks
        env:
          FT_VOX_VALIDATION: "1"
          FT_VOX_VISUAL_SMOKE: ${{ github.event.inputs.visual_mode == 'strict' && '0' || '1' }}
        run: >
          ctest --test-dir build-g --output-on-failure --timeout 900
          -R "VisualRegression|VisualImageMetrics"

      - name: Publish artifacts (screenshots, diffs, metrics, logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-validation-artifacts
          path: |
            build-g/visual-qa/
            build-g/mob-qa/
            build-g/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 14

  gpu-execution-scope:
    # Always reports the ACTUAL execution scope on dispatch. When the trust
    # condition skips the GPU job, or no suitable runner exists, the device
    # tests are NOT EXECUTED — this job states that explicitly so a skipped
    # run can never be read as "passed".
    if: always() && github.event_name == 'workflow_dispatch'
    needs: [gpu-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Report execution scope
        run: |
          {
            echo "## GPU validation scope"
            if [ "${{ github.ref }}" != "refs/heads/main" ]; then
              echo "Dispatch ref \`${{ github.ref }}\` is not the protected \`main\` branch:"
              echo "the GPU job was SKIPPED by the trust policy. Device tests **NOT EXECUTED**."
            elif [ "${{ needs.gpu-linux.result }}" = "success" ]; then
              echo "GPU job executed on the self-hosted runner — see its summary and artifacts."
            else
              echo "GPU job result: \`${{ needs.gpu-linux.result }}\` (no suitable runner, or failure)."
              echo "Device tests **NOT EXECUTED** or **FAILED** — never reported as passed."
            fi
            echo ""
            echo "Unmerged PRs are NOT GPU-validated by this workflow. Run the canonical"
            echo "profile manually before merge (docs/gpu-validation.md). CPU CI"
            echo "(cpu-boundary.yml) remains the per-PR gate."
          } >> "$GITHUB_STEP_SUMMARY"
